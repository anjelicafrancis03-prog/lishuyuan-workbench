<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>医美任务日历·打卡一体</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#faf7f8;margin:0;padding:24px;color:#333}
  h1{color:#c2185b;font-size:22px;margin:0 0 4px}.sub{color:#888;font-size:13px;margin-bottom:16px}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .bar button,.bar select{border:1px solid #e6d3da;background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;color:#c2185b;cursor:pointer}
  .bar button:hover{background:#fdeef3}
  .inp{border:1px solid #e6d3da;border-radius:8px;padding:6px 10px;font-size:13px;width:110px}
  .cal{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden}
  .calhead{display:grid;grid-template-columns:repeat(7,1fr);background:#c2185b;color:#fff;font-size:13px;padding:8px 0;text-align:center}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cell{min-height:84px;border:1px solid #f0e6ea;padding:6px;font-size:12px}
  .cell.other{background:#faf5f7;color:#ccc}.cell.today{background:#fdeef3;outline:2px solid #c2185b}
.cell.lit-green{background:#e8f8ee;box-shadow:inset 0 0 0 2px #27ae60}
.cell.lit-red{background:#fdecea;box-shadow:inset 0 0 0 2px #e74c3c}
.cell.lit-yellow{background:#fef9e7;box-shadow:inset 0 0 0 2px #f39c12}
.legend{display:flex;gap:14px;font-size:12px;color:#666;margin:6px 2px 10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block}
  .dnum{font-weight:600;color:#c2185b;font-size:13px}
  .tk{background:#fff0f5;border-left:3px solid #c2185b;border-radius:4px;padding:3px 5px;margin-top:4px;font-size:11px;line-height:1.3}
  .tk b{display:block;color:#333;font-weight:600}.tk .m{color:#c2185b;font-size:10px}
  .tk.done{background:#effaf0;border-left-color:#27ae60}.tk.done b{color:#888;text-decoration:line-through}
  .tk.overdue{background:#fdecea;border-left-color:#e74c3c}
  h2{color:#c2185b;font-size:17px;margin:22px 0 10px}
  .list{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:14px 16px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:#888;font-weight:500;font-size:12px;padding:6px 8px;border-bottom:2px solid #f0e6ea}
  td{padding:8px;border-bottom:1px solid #f5eef1}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;color:#fff}
  .warn{color:#e74c3c;font-weight:600}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5eef1;flex-wrap:wrap}
  .row:last-child{border-bottom:none}
  .row .t{flex:1;min-width:200px}.row .t b{display:block}.row .t span{color:#888;font-size:12px}
  .btn{border:none;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:#fff}
  .btn.ok{background:#27ae60}.btn.skip{background:#f39c12}.btn.miss{background:#e74c3c}.btn.done{background:#27ae60}.btn.gray{background:#bdc3c7}
  .btn:hover{opacity:.85}
  .streak{font-size:12px;color:#c2185b;font-weight:600}
  .empty{color:#aaa;padding:16px;text-align:center}
  .loading{color:#c2185b;text-align:center;padding:30px}
  a{color:#c2185b;text-decoration:none}
<style>
/* === v6.2 mobile: 日历真自适应（不横滑，整体缩进屏宽） === */
@media (max-width: 600px) {
  .cal { overflow: visible !important; }
  .calgrid { min-width: 0 !important; grid-template-columns: repeat(7, 1fr); }
  .cell { min-height: 54px !important; padding: 3px 2px !important; overflow: hidden; }
  .dnum { font-size: 11px !important; }
  .tk { font-size: 9px !important; padding: 1px 3px !important; margin-top: 2px !important; border-left-width: 2px !important; }
  .tk b { display: inline-block !important; max-width: 100% !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .calhead { font-size: 11px !important; padding: 4px 0 !important; }
  h1 { font-size: 18px !important; }
  h2 { font-size: 15px !important; }
}</style></style>
</head>
<body>
<h1>🗓️ 医美任务日历 · 打卡一体</h1>
<div class="sub">日历 + 每日三态打卡 / 一次性完成 / 逾期红标 · 打卡即署名 · 数据实时读写任务表+打卡表</div>
<div class="bar">
  <span class="sub" style="margin:0">打卡人：</span><input class="inp" id="who" placeholder="昵称">
  <span class="sub" style="margin:0 0 0 6px">（打卡/完成自动署名）</span>
  <span style="flex:1"></span>
  <button id="prev">‹ 上月</button>
  <select id="monthSel"></select>
  <button id="next">下月 ›</button>
</div>
<div class="legend"><span><span class="dot" style="background:#e8f8ee;border:2px solid #27ae60"></span>全部完成</span><span><span class="dot" style="background:#fef9e7;border:2px solid #f39c12"></span>部分完成</span><span><span class="dot" style="background:#fdecea;border:2px solid #e74c3c"></span>有错过/未打</span><span><span class="dot" style="background:#fff;border:1px solid #ddd"></span>无例行任务/未来</span></div>
<div class="cal" data-sp-bindable="database" data-sp-database-id="glqvIFb5dyy2kNicdbpSFp">
  <div class="calhead" id="calhead"></div>
  <div class="calgrid" id="calgrid"><div class="loading">加载中…</div></div>
</div>
<h2>🔁 今日例行打卡</h2>
<div class="list" id="dailyZone" data-sp-bindable="database" data-sp-database-id="glqvIFb5dyy2kNicdbpSFp"><div class="loading">加载中…</div></div>
<h2>📋 全部任务（按截止日排序）</h2>
<div class="list" data-sp-bindable="database" data-sp-database-id="glqvIFb5dyy2kNicdbpSFp"><div class="loading" id="listwrap">加载中…</div></div>
<div class="sub">数据源：<a href="https://www.workbuddy.cn/space/d/glqvIFb5dyy2kNicdbpSFp">任务表</a> · <a href="https://www.workbuddy.cn/space/d/STlIbNmsdUkl2qnoVsMVHZ">打卡表</a></div>

<script>
var db = window.__SMART_PAGE__.database;
var DATABASE_ID = 'glqvIFb5dyy2kNicdbpSFp';
var PUNCH_DB = 'STlIbNmsdUkl2qnoVsMVHZ';
var F = {task:'任务', plate:'板块', chan:'渠道/平台', mode:'任务模式', status:'状态', pri:'优先级', due:'截止日', doneAt:'完成时间', doneBy:'完成人'};
var PF = {task:'任务', date:'日期', st:'打卡状态', who:'打卡人'};
var ST_COLOR = {'待办':'#e74c3c','进行中':'#2980b9','已完成':'#27ae60'};
var WD = ['一','二','三','四','五','六','日'];
var curY = new Date().getFullYear(), curM = new Date().getMonth();
var punchMap = {}; // "任务\u0000日期" -> 状态

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function parseDue(v){ return v ? new Date(v) : null; }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return fmtDate(new Date()); }
function who(){ var w=document.getElementById('who').value.trim(); if(w) localStorage.setItem('wb_who',w); return w||'匿名'; }
document.getElementById('who').value = localStorage.getItem('wb_who')||'';

function punch(taskName, st){
  db.addRecord({databaseId:'STlIbNmsdUkl2qnoVsMVHZ', properties:{
    [PF.task]:{text:taskName},
    [PF.date]:{date:todayStr()},
    [PF.st]:{select:st},
    [PF.who]:{text:who()}
  }}).then(function(){ punchMap[taskName+'\u0000'+todayStr()]=st; localStorage.removeItem('wb_punch_pending'); reloadAll(); })
  .catch(function(e){ alert('打卡失败：'+e.message); });
}
function finish(taskName, rid){
  db.updateRecord({databaseId:'glqvIFb5dyy2kNicdbpSFp', recordId:rid, properties:{
    [F.status]:{text:'已完成'},
    [F.doneAt]:{date:todayStr()},
    [F.doneBy]:{text:who()}
  }}).then(reloadAll).catch(function(e){ alert('完成失败：'+e.message); });
}
function streak(taskName){
  var n=0, d=new Date();
  for(var i=0;i<365;i++){
    var st=punchMap[taskName+'\u0000'+fmtDate(d)];
    if(st==='完成') n++;
    else if(st!=='跳过'){ if(n>0||i>0) break; if(i===0) break; }
    d.setDate(d.getDate()-1);
  }
  return n;
}

function renderMonth(rows){
  var first=new Date(curY,curM,1), offset=(first.getDay()+6)%7;
  var start=new Date(curY,curM,1-offset), grid=[];
  for(var i=0;i<42;i++){ var d=new Date(start); d.setDate(start.getDate()+i); grid.push(d); }
  var byDate={};
  rows.forEach(function(r){ var dd=parseDue(r[F.due]); if(dd){ var k=fmtDate(dd); (byDate[k]=byDate[k]||[]).push(r); } });
  // 每日例行任务清单（用于回溯历史打卡判定）
  var dailyTasks = rows.filter(function(t){ return String(t[F.mode]||'').indexOf('每天')>=0 && t[F.status]!=='已完成'; }).map(function(t){ return t[F.task]; });
  function dayLit(k, d){
    // 返回 'green'|'yellow'|'red'|null
    if(!dailyTasks.length) return null;
    var future = d > new Date(new Date().setHours(0,0,0,0));
    if(future) return null;
    var done=0, skip=0, miss=0, none=0;
    dailyTasks.forEach(function(tn){
      var st = punchMap[tn+'␀'+k];
      if(st==='完成') done++;
      else if(st==='跳过') skip++;
      else if(st==='错过') miss++;
      else { // 无打卡记录：过去的日子视为错过，今天为未打
        if(d < new Date(new Date().setHours(0,0,0,0))) miss++; else none++;
      }
    });
    if(done===dailyTasks.length) return 'green';
    if(miss>0) return 'red';
    if(done>0||skip>0||none>0&&d<new Date(new Date().setHours(0,0,0,0))) return done>0?'yellow':'red';
    return null;
  }
  var html=grid.map(function(d){
    var cls='cell'+(d.getMonth()!==curM?' other':'')+(fmtDate(d)===fmtDate(new Date())?' today':'');
    var lit=dayLit(fmtDate(d), d);
    if(lit==='green') cls+=' lit-green';
    else if(lit==='red' && d.getMonth()===curM) cls+=' lit-red';
    else if(lit==='yellow') cls+=' lit-yellow';
    var tks=byDate[fmtDate(d)]||[], tk='';
    tks.slice(0,3).forEach(function(t){
      var done=t[F.status]==='已完成', od=!done&&parseDue(t[F.due])<new Date(new Date().setHours(0,0,0,0));
      tk+='<div class="tk'+(done?' done':od?' overdue':'')+'"><b>'+esc(String(t[F.task]||'').slice(0,20))+'</b><span class="m">'+esc(t[F.plate]||'')+' · '+esc(t[F.status]||'')+'</span></div>';
    });
    if(tks.length>3) tk+='<div class="tk"><b>+'+ (tks.length-3) +' 项</b></div>';
    return '<div class="'+cls+'"><div class="dnum">'+d.getDate()+'</div>'+tk+'</div>';
  }).join('');
  document.getElementById('calhead').innerHTML=WD.map(function(w){return '<div>'+w+'</div>';}).join('');
  document.getElementById('calgrid').innerHTML=html;
  document.getElementById('monthSel').value=curY+'-'+String(curM+1).padStart(2,'0');
}

function renderDaily(rows){
  var today=todayStr();
  var daily=rows.filter(function(t){ return String(t[F.mode]||'').indexOf('每天')>=0 && t[F.status]!=='已完成'; });
  var h='';
  if(!daily.length){ h='<div class="empty">今日无例行任务</div>'; }
  daily.forEach(function(t){
    var st=punchMap[t[F.task]+'\u0000'+today];
    var stTag=st?('<span class="tag" style="background:'+({完成:'#27ae60',跳过:'#f39c12',错过:'#e74c3c'}[st]||'#7f8c8d')+'">今日'+st+'</span>'):'<span class="tag" style="background:#bdc3c7">未打卡</span>';
    var btns=st?'<button class="btn gray" disabled>已'+st+'</button>':
      '<button class="btn ok" onclick="punch(\''+esc(t[F.task])+'\',\'完成\')">✅完成</button>'+
      '<button class="btn skip" onclick="punch(\''+esc(t[F.task])+'\',\'跳过\')">➖跳过</button>'+
      '<button class="btn miss" onclick="punch(\''+esc(t[F.task])+'\',\'错过\')">❌错过</button>';
    h+='<div class="row"><div class="t"><b>'+esc(t[F.task])+'</b><span>'+esc(t[F.plate]||'')+' · '+esc(t[F.chan]||'')+'</span></div>'+
       '<span class="streak">🔥 连续 '+streak(t[F.task])+' 天</span>'+stTag+'<div>'+btns+'</div></div>';
  });
  document.getElementById('dailyZone').innerHTML=h;
}

function renderList(rows){
  var today0=new Date(); today0.setHours(0,0,0,0);
  var h='<table><tr><th>任务</th><th>板块</th><th>状态</th><th>优先级</th><th>截止日</th><th>操作</th></tr>';
  rows.forEach(function(r){
    var dd=parseDue(r[F.due]), dueS=dd?fmtDate(dd):'-', od=dd&&dd<today0&&r[F.status]!=='已完成';
    var done=r[F.status]==='已完成';
    var btn=done?('<span class="sub">'+esc(r[F.doneAt]?String(r[F.doneAt]).slice(0,10):'-')+' · '+esc(r[F.doneBy]||'-')+'</span>')
                 :'<button class="btn done" onclick="finish(\''+esc(r[F.task])+'\',\''+r.record_id+'\')">✅完成</button>';
    h+='<tr><td><b>'+esc(r[F.task]||'')+'</b>'+(od?' <span class="warn">⚠️逾期</span>':'')+'</td><td>'+esc(r[F.plate]||'')+'</td>'+
       '<td><span class="tag" style="background:'+(ST_COLOR[r[F.status]]||'#7f8c8d')+'">'+esc(r[F.status]||'')+'</span></td>'+
       '<td>'+esc(r[F.pri]||'')+'</td><td class="'+(od?'warn':'')+'">'+dueS+'</td><td>'+btn+'</td></tr>';
  });
  document.getElementById('listwrap').innerHTML=h+'</table>';
}

function load(){
  Promise.all([
    db.query({databaseId:'glqvIFb5dyy2kNicdbpSFp', sorts:[{property:F.due, direction:'ascending'}], pageSize:200}),
    db.query({databaseId:'STlIbNmsdUkl2qnoVsMVHZ', pageSize:500})
  ]).then(function(res){
    var rows=res[0].results||[], punches=res[1].results||[];
    punchMap={};
    punches.forEach(function(p){ punchMap[p[PF.task]+'\u0000'+String(p[PF.date]||'').slice(0,10)]=p[PF.st]; });
    renderMonth(rows); renderDaily(rows); renderList(rows);
  }).catch(function(e){
    document.getElementById('calgrid').innerHTML='<div class="empty">加载失败：'+esc(e.message||e)+'</div>';
  });
}
function reloadAll(){
  db.query({databaseId:'glqvIFb5dyy2kNicdbpSFp', sorts:[{property:F.due, direction:'ascending'}], pageSize:200}).then(function(res){
    var rows=res.results||[];
    renderMonth(rows); renderDaily(rows); renderList(rows);
  });
}
document.getElementById('prev').onclick=function(){ if(--curM<0){curM=11;curY--;} reloadAll(); };
document.getElementById('next').onclick=function(){ if(++curM>11){curM=0;curY++;} reloadAll(); };
document.getElementById('monthSel').onchange=function(){ var p=document.getElementById('monthSel').value.split('-'); curY=+p[0]; curM=+p[1]-1; reloadAll(); };
document.getElementById('who').addEventListener('change', load);
load();
</script>
</body>
</html>
