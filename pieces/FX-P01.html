<div class="body">为什么你在市面上看到的 PEEK 鼻基底设计都是圆润的？设计师的审美和设计功底，到底有多重要？

有棱角的 PEEK 和没有棱角的 PEEK，呈现在脸上完完全全是天差地别。

这种圆润设计你装上后跟馒头没区别。我们亚洲人的皮肤厚度普遍偏厚，如果设计的假体没有棱角感，在你脸上呈现出来的就是抛光感、蛮化感——没有高光点、没有折叠度、没有骨感的馒头。</div>
